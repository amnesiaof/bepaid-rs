[package]
name = "bepaid"
version = "0.6.4"
edition = "2024"
description = "Async client for the bePaid payment API (bepaid.by)"
license = "MIT"
readme = "README.md"
repository = "https://github.com/amnesiaof/bepaid-rs"
homepage = "https://github.com/amnesiaof/bepaid-rs"
keywords = ["bepaid", "payment", "gateway", "checkout", "cards"]
categories = ["api-bindings", "web-programming"]

[dependencies]
base64 = "0.23"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rsa = { version = "0.9", features = ["sha2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
wiremock = "0.6"